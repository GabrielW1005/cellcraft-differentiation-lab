<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Cellcraft — Differentiation Lab</title>
<link rel="stylesheet" href="style.css">
<script src="cells.js" defer></script><script src="worksheet.js" defer></script><script src="journal.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to activity</a>
<header class="topbar">
<a class="brand" href="#worksheet" aria-label="Cellcraft home" id="homeLink"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>cellcraft<span class="brand-sub">DIFFERENTIATION LAB</span></span></a>
<nav aria-label="Main navigation" id="mainNav">
<button data-view="worksheet" class="nav-item active"><span aria-hidden="true">▧</span> Worksheet</button>
<button data-view="missions" class="nav-item"><span aria-hidden="true">◉</span> Cell missions</button>
