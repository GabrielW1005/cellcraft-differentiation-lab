<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2e"><meta name="description" content="A 2D microscopic action game. Engulf bacteria, deliver oxygen, send nerve signals and grow a root hair. Original grade 7 cell biology adventures."><title>Cellcraft · Micro Missions</title><link rel="stylesheet" href="style.css"><script src="science.js" defer></script><script src="render.js" defer></script><script src="engine.js" defer></script><script src="game.js" defer></script></head><body>
<canvas id="world" tabindex="0" aria-label="Cellcraft 2D game. Keyboard: WASD or arrows to move, Space for cell action, P to pause. Use the mission instructions for each specialist."></canvas>
<header><button id="home" class="brand" aria-label="Open mission menu"><span class="brand-icon">◉</span><span>cellcraft<small>MICRO MISSIONS</small></span></button><div id="missionLabel" class="mission-label">A SMALL WORLD. A BIG ADVENTURE.</div><div class="header-buttons"><button id="scienceBtn" title="Science and controls" aria-label="Science and controls">?</button><button id="soundBtn" aria-label="Turn sound on" title="Turn sound on">♪<span class="muted-line">/</span></button><button id="pauseBtn" aria-label="Pause game" title="Pause (P)">Ⅱ</button><button id="fullBtn" aria-label="Full screen" title="Full screen">⛶</button></div></header>
<div id="hud" hidden><div class="hud-box"><span id="goalLabel">BACTERIA CLEARED</span><strong id="goalValue">0 / 10</strong><div class="track"><i id="goalBar"></i></div></div><div class="hud-box secondary-hud"><span id="resourceLabel">CELL ENERGY</span><strong id="resourceValue">100%</strong><div class="track"><i id="resourceBar"></i></div><small id="resourceDetail"></small></div><div class="hud-score"><span>SCORE</span><strong id="score">0</strong><small id="timer">0:00</small></div></div>
<div id="tip" hidden><span class="tip-pip"></span><span id="tipText"></span></div>
<div id="controls" hidden><div id="stick" aria-label="Drag to move" role="group"><span id="stickKnob"></span><i>MOVE</i></div><button id="action"><span id="actionIcon">◎</span><strong id="actionLabel">ENGULF</strong><small id="actionHint">HOLD SPACE</small></button><div class="key-hint" id="keyHint">WASD / ARROWS · MOVE</div></div>
<div id="toast" role="status"></div><div id="overlay"></div>
<dialog id="scienceModal" aria-labelledby="scienceTitle"><button class="close" id="closeScience" aria-label="Close science notes">×</button><div id="scienceContent"></div></dialog>
<div id="announce" class="sr-only" aria-live="polite"></div>
</body></html>
